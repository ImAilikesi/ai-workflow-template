Keep changes minimal and avoid unrelated cleanup. Preserve unrelated user work.

When ready, return: changed paths, verification commands/results, unresolved decisions, material
exclusions, and remaining risk. Do not claim completion without current evidence.

You are not the owner or reviewer. Do not commit, push, merge, deploy, spend, use credentials, send
external messages, or perform destructive or irreversible actions unless separately authorized.
