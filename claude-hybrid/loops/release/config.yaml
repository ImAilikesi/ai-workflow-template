# Release Loop — config

loop: release

driver: codex                      # Codex drives the checklist; user ships
deploy_target: "<ENV>"             # e.g. staging | production — placeholder

test_cmd: "<TEST_COMMAND>"
build_cmd: "<BUILD_COMMAND>"
failure_budget: 3                  # check failures to investigate before declaring NO-GO & stop

checks:                            # toggle per project
  tests: true
  build: true
  docs: true
  config: true
  env: true
  migrations: true
  deployment_risk: true

# any of these failing -> VERDICT: NO-GO
block_on:
  - tests_failing
  - build_failing
  - secrets_committed
  - irreversible_migration
  - no_rollback_plan

ship_authority: user               # GO is advisory; the user performs the release
