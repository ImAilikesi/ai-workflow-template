# Audit Loop — config

loop: audit

auditor: both                      # claude | codex | both (independent passes, reconciled)

scope:                             # pick one or more
  - codebase
  # - architecture
  # - security
  # - ux
  # - project

severity_scale: [critical, high, medium, low]   # highest first in the report

output_path: "<AUDIT_REPORT.md>"   # where findings are written (the verification surface)

apply_fixes: false                 # audit only — recommendations, never changes
failure_budget: 3                  # inspection errors (unreadable/blocked areas) before escalate
