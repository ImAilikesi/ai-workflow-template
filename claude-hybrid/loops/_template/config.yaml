# <loop-name> Loop — config
# RAW TEMPLATE. Copy with loop.md, fill every <...>. Placeholders only — no real values here.

loop: "<loop-name>"

driver: "<opus | codex | hermes | deepseek-v4-flash | minimax-m3 | any>"

# The stop condition, mirrored from loop.md "Done when" (one line).
done_when: "<this is done when ___>"

# Verification surface: the commands/checks that prove done. At least one real check.
verify_cmds:
  - "<TEST_OR_BUILD_OR_METRIC_COMMAND>"

# Long-running-work guards (see _shared/operating-rules.md)
failure_budget: 3                  # distinct failures before stop & escalate
max_retries: 2                     # same error, no new info -> stop guessing
loc_cap: 300                       # keep delegated/bounded changes under this

# Stop conditions (extend per loop)
stop_conditions:
  - budget_hit
  - repeated_failure
  - scope_breach
  - unresolved_decision

# Add loop-specific knobs below as needed.
