# Debug Loop — config

loop: debug

driver: codex                      # Codex drives; Opus takes unclear/architectural debugging

require_repro: true                # must reproduce before fixing; no guessing
require_failing_test_first: true   # write a test that fails for this bug, then fix
no_unrelated_changes: true         # smallest fix only; mention adjacent issues, don't touch

test_cmd: "<TEST_COMMAND>"         # e.g. pytest -q / npm test / cargo test (verification surface)
max_retries: 3                     # same-error root-cause attempts before stop & escalate
failure_budget: 4                  # distinct dead-end causes before stop & escalate

# mention but do not change:
on_adjacent_smell: mention_only
